<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;font-family:Barlow,sans-serif;color:#15171C;background:#F7F7F7;position:relative}
.map{position:absolute;inset:0 0 380px 0;background:#EEF0EA}
.map svg{position:absolute;inset:0}
.pill{position:absolute;top:56px;left:16px;right:16px;height:48px;border-radius:24px;background:#fff;box-shadow:0 4px 14px rgba(21,23,28,.12);display:flex;align-items:center;gap:10px;padding:0 18px;font-size:15px}
.pill i{width:10px;height:10px;border-radius:50%;background:#1D4ED8;display:block}
.pill b{font-weight:600}
.pill span{margin-left:auto;font-size:13px;color:#5A5F69}
.sheet{position:absolute;left:0;right:0;bottom:76px;height:328px;background:#fff;border-radius:24px 24px 0 0;box-shadow:0 -6px 20px rgba(21,23,28,.10);padding:10px 20px 16px}
.handle{width:40px;height:4px;border-radius:2px;background:#D3D5CC;margin:0 auto 10px}
.k{font-size:13px;color:#5A5F69;font-weight:600;letter-spacing:.6px;text-transform:uppercase}
h1{font:700 40px/1 'Barlow Condensed';margin:2px 0 12px}
h1 em{font-style:normal;color:#1D4ED8}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.c{height:66px;border:1.5px solid #D3D5CC;border-radius:14px;padding:8px 10px;text-align:center}
.c b{display:block;font:700 17px/1.1 'Barlow Condensed';text-transform:uppercase}
.c small{display:block;font-size:12px;color:#5A5F69;margin-top:2px}
.c.on{border:2px solid #1D4ED8;background:#EAF0FE}
.c.on b,.c.on small{color:#1E3A8A}
.wide{height:44px;border:1.5px solid #D3D5CC;border-radius:14px;margin-top:8px;display:flex;align-items:center;justify-content:space-between;padding:0 14px}
.wide b{font:700 17px 'Barlow Condensed';text-transform:uppercase}
.wide small{font-size:12px;color:#5A5F69}
.row{display:flex;align-items:center;gap:8px;font-size:14px;margin:10px 0}
.box{width:20px;height:20px;border-radius:5px;background:#1D4ED8}
.cta{height:56px;border-radius:16px;background:#1D4ED8;color:#fff;font:700 22px 'Barlow Condensed';letter-spacing:1px;display:flex;align-items:center;justify-content:center}
.tabs{position:absolute;left:0;right:0;bottom:0;height:76px;background:#fff;border-top:1px solid #E2E0DA;display:flex;justify-content:space-around;padding-top:12px;font-size:12px;color:#5A5F69}
.tabs .on{color:#1D4ED8;font-weight:600}
</style></head><body>
<div class="map">
<svg width="390" height="464" viewBox="0 0 390 464">
<path d="M0 290 L390 250" stroke="#fff" stroke-width="10"/>
<path d="M195 0 L200 464" stroke="#fff" stroke-width="12"/>
<path d="M40 0 L120 464 M330 0 L270 464 M0 140 L390 110" stroke="#fff" stroke-width="6"/>
<path d="M300 0 C260 120 360 220 300 464" stroke="#CFE0EE" stroke-width="16" fill="none"/>
<circle cx="198" cy="270" r="20" fill="rgba(29,78,216,.18)"/>
<circle cx="198" cy="270" r="9" fill="#1D4ED8" stroke="#fff" stroke-width="3"/>
</svg>
<div class="pill"><i></i><b>From Cordon, Isabela</b><span>9:40 AM</span></div>
</div>
<div class="sheet">
<div class="handle"></div>
<p class="k">Half-day loop · 4 hrs · ~120 km</p>
<h1>BACK BY <em>1:40 PM</em></h1>
<div class="three">
<div class="c"><b>Quick</b><small>back 10:40</small></div>
<div class="c on"><b>Half-day</b><small>back 1:40</small></div>
<div class="c"><b>Full day</b><small>back 3:40</small></div>
</div>
<div class="wide"><b>Multi-day</b><small>2+ days · overnight stops</small></div>
<div class="row"><div class="box"></div>Avoid highways</div>
<div class="cta">GENERATE LOOP</div>
</div>
<div class="tabs"><div>Feed</div><div class="on">Ride</div><div>Create</div><div>Me</div></div>
</body></html>
