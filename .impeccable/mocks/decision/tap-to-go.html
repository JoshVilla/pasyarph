<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;font-family:Barlow,sans-serif;color:#15171C;background:#F7F7F7;position:relative}
.map{position:absolute;inset:0 0 400px 0;background:#EEF0EA}
.map svg{position:absolute;inset:0}
.pill{position:absolute;top:56px;left:16px;right:16px;height:48px;border-radius:24px;background:#fff;box-shadow:0 4px 14px rgba(21,23,28,.12);display:flex;align-items:center;gap:10px;padding:0 18px;font-size:15px}
.pill i{width:10px;height:10px;border-radius:50%;background:#1D4ED8;display:block}
.pill b{font-weight:600}
.sheet{position:absolute;left:0;right:0;bottom:76px;height:348px;background:#fff;border-radius:24px 24px 0 0;box-shadow:0 -6px 20px rgba(21,23,28,.10);padding:10px 20px 16px}
.handle{width:40px;height:4px;border-radius:2px;background:#D3D5CC;margin:0 auto 12px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font:700 26px/1 'Barlow Condensed';text-transform:uppercase}
.chip{height:36px;border-radius:18px;background:#F3F2EE;display:flex;align-items:center;gap:6px;padding:0 12px;font-size:13px;font-weight:600}
.chip i{width:16px;height:16px;border-radius:4px;background:#1D4ED8;display:block}
.c{height:64px;border-radius:16px;background:#F3F2EE;display:flex;align-items:center;padding:0 8px 0 16px;margin-bottom:8px}
.c div{flex:1}
.c b{display:block;font:700 22px/1 'Barlow Condensed';text-transform:uppercase}
.c small{font-size:13px;color:#5A5F69}
.go{width:48px;height:48px;border-radius:14px;background:#1D4ED8;color:#fff;font:700 22px Barlow;display:flex;align-items:center;justify-content:center}
.c.multi{background:#fff;border:1.5px solid #D3D5CC}
.c.multi .go{background:#15171C}
.hint{font-size:12px;color:#5A5F69;text-align:center;margin-top:2px}
.tabs{position:absolute;left:0;right:0;bottom:0;height:76px;background:#fff;border-top:1px solid #E2E0DA;display:flex;justify-content:space-around;padding-top:12px;font-size:12px;color:#5A5F69}
.tabs .on{color:#1D4ED8;font-weight:600}
</style></head><body>
<div class="map">
<svg width="390" height="444" viewBox="0 0 390 444">
<path d="M0 270 L390 230" stroke="#fff" stroke-width="10"/>
<path d="M195 0 L200 444" stroke="#fff" stroke-width="12"/>
<path d="M40 0 L120 444 M330 0 L270 444 M0 140 L390 110" stroke="#fff" stroke-width="6"/>
<path d="M300 0 C260 120 360 220 300 444" stroke="#CFE0EE" stroke-width="16" fill="none"/>
<circle cx="198" cy="250" r="20" fill="rgba(29,78,216,.18)"/>
<circle cx="198" cy="250" r="9" fill="#1D4ED8" stroke="#fff" stroke-width="3"/>
</svg>
<div class="pill"><i></i><b>From Cordon, Isabela</b></div>
</div>
<div class="sheet">
<div class="handle"></div>
<div class="top"><h1>How long today?</h1><div class="chip"><i></i>Avoid highways</div></div>
<div class="c"><div><b>Quick</b><small>1 hr · ~50 km</small></div><div class="go">→</div></div>
<div class="c"><div><b>Half-day</b><small>4 hrs · ~120 km</small></div><div class="go">→</div></div>
<div class="c"><div><b>Full day</b><small>6 hrs · ~220 km</small></div><div class="go">→</div></div>
<div class="c multi"><div><b>Multi-day</b><small>2+ days · overnight stops</small></div><div class="go">→</div></div>
<p class="hint">Tap a length. Your loop is ready in a few seconds.</p>
</div>
<div class="tabs"><div>Feed</div><div class="on">Ride</div><div>Create</div><div>Me</div></div>
</body></html>
