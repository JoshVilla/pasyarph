<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Post at the stop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C2410C}a:hover{color:#9A3412}
</style>
</head>
<body>


<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; font-family: 'Barlow', system-ui, sans-serif; color: #15171C; box-sizing: border-box; padding: 56px 20px 36px; display: flex; flex-direction: column; gap: 20px">

<div style="display: flex; align-items: center; justify-content: space-between">
<a href="03-riding.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; background: #F3F2EE; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#15171C" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</a>
<div style="height: 32px; border-radius: 16px; background: #E6EEFB; color: #1E3A8A; display: flex; align-items: center; gap: 6px; padding: 0 12px; font-size: 13px; font-weight: 600">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1E3A8A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l4 4 10-10"></path></svg>
GPS confirmed at stop
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 36px; letter-spacing: 0.5px">YOU MADE IT</h1>
<p style="margin: 0; font-size: 16px; color: #5A5F69">[Stop name] Viewpoint · 52 km into your loop</p>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span style="font-size: 15px; font-weight: 600">Photos</span>
<span style="font-size: 14px; color: #5A5F69">4 / 10</span>
</div>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
<div style="aspect-ratio: 1; border-radius: 10px; background: #B9C7B0"></div>
<div style="aspect-ratio: 1; border-radius: 10px; background: #9FB4C4"></div>
<div style="aspect-ratio: 1; border-radius: 10px; background: #C9B79C"></div>
<div style="aspect-ratio: 1; border-radius: 10px; background: #A8B3A0"></div>
<button aria-label="Take photo" style="aspect-ratio: 1; border-radius: 10px; border: 2px solid #C2410C; background: #FBE9DF; display: flex; align-items: center; justify-content: center; padding: 0">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9A3412" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
</button>
<div style="aspect-ratio: 1; border-radius: 10px; border: 1.5px dashed #D3D5CC"></div>
<div style="aspect-ratio: 1; border-radius: 10px; border: 1.5px dashed #D3D5CC"></div>
<div style="aspect-ratio: 1; border-radius: 10px; border: 1.5px dashed #D3D5CC"></div>
<div style="aspect-ratio: 1; border-radius: 10px; border: 1.5px dashed #D3D5CC"></div>
<div style="aspect-ratio: 1; border-radius: 10px; border: 1.5px dashed #D3D5CC"></div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="caption" style="font-size: 15px; font-weight: 600">Caption</label>
<textarea id="caption" placeholder="How was the ride?" style="height: 88px; border-radius: 14px; border: 1.5px solid #E2E0DA; padding: 12px 14px; font-family: inherit; font-size: 15px; resize: none; box-sizing: border-box"></textarea>
</div>

<div style="display: flex; align-items: center; gap: 14px; padding: 12px; border-radius: 16px; background: #F3F2EE">
<svg width="72" height="56" viewBox="0 0 72 56" aria-hidden="true" style="flex-shrink: 0; border-radius: 10px; background: #E7E9E1">
<path d="M34 46 L20 44 L10 22 L33 19 L58 19 L54 40 Z" fill="none" stroke="#C2410C" stroke-width="3" stroke-linejoin="round"></path>
<circle cx="34" cy="46" r="3.5" fill="#1D4ED8"></circle>
</svg>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-weight: 600">Route attached</span>
<span style="font-size: 14px; color: #5A5F69">118 km loop · 3 h 50 ride time</span>
</div>
</div>

<div style="flex: 1"></div>

<div style="display: flex; flex-direction: column; gap: 12px">
<a href="05-newsfeed.html" style="height: 56px; border-radius: 16px; background: #C2410C; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: 1px">POST TO FEED</a>
<a href="03-riding.html" style="align-self: center; font-size: 15px; font-weight: 600; color: #15171C; padding: 8px">Skip and keep riding</a>
</div>
</div>


</body>
</html>
