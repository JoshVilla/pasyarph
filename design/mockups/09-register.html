<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Create account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C2410C}a:hover{color:#9A3412}
</style>
</head>
<body>


<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; font-family: 'Barlow', system-ui, sans-serif; color: #15171C; box-sizing: border-box; padding: 56px 20px 36px; display: flex; flex-direction: column; gap: 18px">

<a href="07-welcome.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #F3F2EE; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#15171C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</a>

<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 36px; letter-spacing: 0.5px">JOIN THE RIDE</h1>
<p style="margin: 0; font-size: 16px; color: #5A5F69">Create your Pasyar account.</p>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button style="height: 52px; border-radius: 14px; border: none; background: #15171C; display: flex; align-items: center; justify-content: center; gap: 10px; font-family: inherit; font-size: 16px; font-weight: 600; color: #FFFFFF">
<span style="width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF; color: #15171C; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px">A</span>Apple</button>
<button style="height: 52px; border-radius: 14px; border: 1.5px solid #E2E0DA; background: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 10px; font-family: inherit; font-size: 16px; font-weight: 600; color: #15171C">
<span style="width: 26px; height: 26px; border-radius: 13px; background: #F3F2EE; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px">G</span>Google</button>
</div>

<div style="display: flex; align-items: center; gap: 12px; color: #5A5F69; font-size: 14px">
<span style="flex: 1; height: 1px; background: #E2E0DA"></span>or sign up with email<span style="flex: 1; height: 1px; background: #E2E0DA"></span>
</div>

<div style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="name" style="font-size: 13px; font-weight: 600; color: #5A5F69">Full name</label>
<input id="name" type="text" placeholder="Juan Dela Cruz" style="height: 52px; border-radius: 12px; border: 1.5px solid #E2E0DA; padding: 0 14px; font-family: inherit; font-size: 16px; color: #15171C; box-sizing: border-box">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="remail" style="font-size: 13px; font-weight: 600; color: #5A5F69">Email</label>
<input id="remail" type="email" placeholder="you@email.com" style="height: 52px; border-radius: 12px; border: 1.5px solid #E2E0DA; padding: 0 14px; font-family: inherit; font-size: 16px; color: #15171C; box-sizing: border-box">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="rpassword" style="font-size: 13px; font-weight: 600; color: #5A5F69">Password</label>
<input id="rpassword" type="password" placeholder="At least 8 characters" style="height: 52px; border-radius: 12px; border: 1.5px solid #E2E0DA; padding: 0 14px; font-family: inherit; font-size: 16px; color: #15171C; box-sizing: border-box">
</div>
</div>

<label style="display: flex; align-items: flex-start; gap: 10px; font-size: 14px; line-height: 1.4; color: #5A5F69; min-height: 44px">
<input type="checkbox" style="width: 20px; height: 20px; accent-color: #C2410C; margin: 1px 0 0; flex-shrink: 0">
<span>I agree to the <a href="09-register.html" style="color: #9A3412; font-weight: 600; text-decoration: none">Terms</a> and <a href="09-register.html" style="color: #9A3412; font-weight: 600; text-decoration: none">Privacy Policy</a>, and I'll ride safely.</span>
</label>

<div style="flex: 1"></div>

<div style="display: flex; flex-direction: column; gap: 14px">
<a href="10-onboarding-profile.html" style="height: 56px; border-radius: 16px; background: #C2410C; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: 1px">CREATE ACCOUNT</a>
<p style="margin: 0; text-align: center; font-size: 15px; color: #5A5F69">Already have an account? <a href="08-login.html" style="font-weight: 600; color: #9A3412; text-decoration: none">Log in</a></p>
</div>
</div>


</body>
</html>
